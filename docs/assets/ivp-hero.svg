<text x="72" y="164" fill="#ffffff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Stop running everything.</text>
<text x="72" y="220" fill="#ffffff" font-family="Arial,sans-serif" font-size="48" font-weight="700">Start verifying smartly.</text>
<text x="74" y="268" fill="#b8c7dc" font-family="Arial,sans-serif" font-size="20">IVP finds relevant checks for a code change — and falls back to the</text>
<text x="74" y="297" fill="#b8c7dc" font-family="Arial,sans-serif" font-size="20">full suite whenever the available evidence is not safe enough.</text>
