services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ivp
      POSTGRES_USER: ivp
      POSTGRES_PASSWORD: ${IVP_POSTGRES_PASSWORD:?Set IVP_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivp -d ivp"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [ivp]

  ivp-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: ivp-api
        VERSION: ${IVP_VERSION:-dev}
        COMMIT: ${IVP_COMMIT:-unknown}
        BUILD_TIME: ${IVP_BUILD_TIME:-unknown}
    environment:
      IVP_ENV: ${IVP_ENV:-development}
      IVP_DEV_AUTH: ${IVP_DEV_AUTH:-1}
      IVP_DEV_TENANT_ID: ${IVP_DEV_TENANT_ID:-11111111-1111-4111-8111-111111111111}
      IVP_DEV_USER_ID: ${IVP_DEV_USER_ID:-22222222-2222-4222-8222-222222222222}
      IVP_DEV_SUBJECT: ${IVP_DEV_SUBJECT:-ivp-local-development}
      IVP_DATABASE_URL: postgres://ivp:${IVP_POSTGRES_PASSWORD:?Set IVP_POSTGRES_PASSWORD in .env}@postgres:5432/ivp?sslmode=disable
      IVP_OIDC_ISSUER: ${IVP_OIDC_ISSUER:-}
      IVP_OIDC_AUDIENCE: ${IVP_OIDC_AUDIENCE:-}
      IVP_OIDC_CLIENT_ID: ${IVP_OIDC_CLIENT_ID:-}
      IVP_LISTEN_ADDR: :8080
      IVP_ARTIFACT_DIR: /var/lib/ivp/artifacts
      IVP_ARTIFACT_BACKEND: filesystem
      IVP_RAW_HISTORY_RETENTION_DAYS: ${IVP_RAW_HISTORY_RETENTION_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - artifacts:/var/lib/ivp/artifacts
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ivp]

volumes:
  postgres-data:
  artifacts:

networks:
  ivp:
    internal: true

