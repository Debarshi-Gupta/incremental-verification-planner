{{- if .Values.retention.enabled }}
{{- if or (lt (int .Values.retention.rawHistoryDays) 1) (gt (int .Values.retention.rawHistoryDays) 36500) }}
{{- fail "retention.rawHistoryDays must be between 1 and 36500" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ivp.fullname" . }}-retention
  labels:
    {{- include "ivp.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.retention.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "ivp.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ default (include "ivp.fullname" .) .Values.serviceAccount.name }}
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: {{ include "ivp.image" . | quote }}
              command: ["/ivp", "maintenance", "retention"]
              env:
                - name: IVP_ENV
                  value: production
                - name: IVP_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.existingSecret }}
                      key: {{ .Values.database.secretKey }}
                - name: IVP_RAW_HISTORY_RETENTION_DAYS
                  value: {{ .Values.retention.rawHistoryDays | quote }}
                - name: IVP_ARTIFACT_BACKEND
                  value: {{ .Values.artifacts.backend | quote }}
                - name: IVP_ARTIFACT_DIR
                  value: {{ .Values.artifacts.directory | quote }}
                {{- if eq .Values.artifacts.backend "s3" }}
                - name: IVP_S3_ENDPOINT
                  value: {{ .Values.artifacts.endpoint | quote }}
                - name: IVP_S3_REGION
                  value: {{ .Values.artifacts.region | quote }}
                - name: IVP_S3_BUCKET
                  value: {{ .Values.artifacts.bucket | quote }}
                - name: IVP_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.artifacts.existingSecret }}
                      key: {{ .Values.artifacts.accessKeyKey }}
                - name: IVP_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.artifacts.existingSecret }}
                      key: {{ .Values.artifacts.secretKeyKey }}
                - name: IVP_S3_SESSION_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.artifacts.existingSecret }}
                      key: {{ .Values.artifacts.sessionTokenKey }}
                      optional: true
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              {{- if eq .Values.artifacts.backend "filesystem" }}
              volumeMounts:
                - name: artifacts
                  mountPath: {{ .Values.artifacts.directory }}
              {{- end }}
          {{- if eq .Values.artifacts.backend "filesystem" }}
          volumes:
            - name: artifacts
              {{- if .Values.artifacts.persistence.existingClaim }}
              persistentVolumeClaim:
                claimName: {{ .Values.artifacts.persistence.existingClaim }}
              {{- else if .Values.artifacts.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "ivp.fullname" . }}-artifacts
              {{- else }}
              emptyDir:
                sizeLimit: {{ .Values.artifacts.persistence.size }}
              {{- end }}
          {{- end }}
{{- end }}

